[package]
name = "business-lead-finder"
license = "MIT"
version = "0.1.1"
description = "Business Lead Finder desktop app with Apify MCP integration"
edition = "2021"

[lib]
name = "business_lead_finder_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", features = [] }
tauri-plugin-store = { version = "2" }
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
tauri-plugin-mcp-client = { git = "https://github.com/sublayerapp/tauri-plugin-mcp-client" }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"

# Vendored copy built as rlib only: the upstream cdylib exports overflow GNU ld on Windows.
[patch."https://github.com/sublayerapp/tauri-plugin-mcp-client"]
tauri-plugin-mcp-client = { path = "vendor/tauri-plugin-mcp-client" }
